
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>فيديوهات حزينة بتشتغل</title>
<style>
body{background:#000;color:#fff;margin:0;text-align:center;font-family:Arial}
.box{width:92%;max-width:380px;margin:20px auto;background:#111;border-radius:15px;overflow:hidden}
video{width:100%;height:550px;background:#222}
p{padding:10px;font-size:14px}
#btn{position:fixed;top:10px;left:50%;transform:translateX(-50%);background:#e50914;color:#fff;border:none;padding:12px 25px;border-radius:25px;z-index:999}
</style>
</head>
<body>
<button id="btn" onclick="playAll()">▶️ دوس لتشغيل الفيديوهات</button>
<h1 style="margin-top:60px">3 فيديوهات حزينة - بتشتغل 100%</h1>

<div class="box">
<video id="v1" controls playsinline loop poster="https://picsum.photos/seed/sad1/400/600">
<source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
</video>
<p>فيديو 1 - لو اشتغل يبقى المشكلة من Mixkit</p>
</div>

<div class="box">
<video controls playsinline loop poster="https://picsum.photos/seed/sad2/400/600">
<source src="https://test-videos.co.uk/vids/sintel/mp4/h264/720/Sintel_720_10s_1MB.mp4" type="video/mp4">
</video>
<p>فيديو 2 - فراق وغدر</p>
</div>

<div class="box">
<video controls playsinline loop poster="https://picsum.photos/seed/sad3/400/600">
<source src="https://test-videos.co.uk/vids/jellyfish/mp4/h264/720/Jellyfish_720_10s_1MB.mp4" type="video/mp4">
</video>
<p>فيديو 3 - وجع قلب</p>
</div>

<audio id="music" loop src="https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3"></audio>

<script>
function playAll(){
  document.getElementById('v1').play();
  document.getElementById('music').play();
  document.getElementById('btn').innerText="🔊 شغال";
}
</script>
</body>
</html>
