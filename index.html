
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>كلنا عابري سبيل - 40 ثانية</title>
<style>
body{background:#000;color:#fff;margin:0;text-align:center;font-family:Arial}
h1{padding:15px;font-size:20px}
.clip{width:92%;max-width:380px;height:680px;margin:25px auto;border-radius:20px;overflow:hidden;position:relative;background:#111;box-shadow:0 0 20px rgba(255,0,0,0.2)}
.clip-bg{position:absolute;inset:0;background-size:cover;background-position:center;transition:all 0.8s}
.clip-text{position:absolute;bottom:60px;left:0;right:0;padding:15px;font-size:19px;font-weight:bold;background:linear-gradient(transparent,rgba(0,0,0,0.9));text-shadow:2px 2px 8px #000}
.progress{position:absolute;bottom:0;left:0;height:4px;background:#e50914;width:0%;transition:width 0.1s}
.info{position:absolute;top:15px;right:15px;background:rgba(0,0,0,0.6);padding:5px 10px;border-radius:10px;font-size:11px}
.timer{position:absolute;top:15px;left:15px;background:rgba(229,9,20,0.8);padding:5px 10px;border-radius:10px;font-size:11px}
#musicBtn{position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:999;background:#e50914;color:#fff;border:none;padding:12px 20px;border-radius:25px;font-size:14px}
</style>
</head>
<body>
<button id="musicBtn" onclick="toggleAll()">▶️ شغل الكل بالموسيقى</button>
<h1 style="margin-top:60px">فيديو كليب حزين 40 ثانية 💔</h1>
<div id="clips"></div>
<audio id="mainAudio" loop></audio>

<script>
// كل كليب = 20 صورة + أغنية حزينة + مدة 40 ثانية
const clipsData=[
{
  title:"كليب فراق - 20 صورة",
  music:"https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3?filename=sad-piano-110618.mp3",
  quotes:["الفراق لا يقتل القلب","لكنه يترك القلب بلا حياة","أصعب فراق فراق من تحب","رحلت وتركتني لوجعي","الفراق وجع لا ينتهي"],
  images:["https://images.pexels.com/photos/1482476/pexels-photo-1482476.jpeg?w=500","https://images.pexels.com/photos/1421903/pexels-photo-1421903.jpeg?w=500","https://images.pexels.com/photos/355465/pexels-photo-355465.jpeg?w=500","https://images.pexels.com/photos/1165991/pexels-photo-1165991.jpeg?w=500","https://images.pexels.com/photos/1279813/pexels-photo-1279813.jpeg?w=500","https://images.pexels.com/photos/1536314/pexels-photo-1536314.jpeg?w=500","https://images.pexels.com/photos/1482476/pexels-photo-1482476.jpeg?w=500","https://images.pexels.com/photos/1421903/pexels-photo-1421903.jpeg?w=500","https://images.pexels.com/photos/355465/pexels-photo-355465.jpeg?w=500","https://images.pexels.com/photos/1165991/pexels-photo-1165991.jpeg?w=500","https://images.pexels.com/photos/1279813/pexels-photo-1279813.jpeg?w=500","https://images.pexels.com/photos/1536314/pexels-photo-1536314.jpeg?w=500","https://images.pexels.com/photos/1482476/pexels-photo-1482476.jpeg?w=500","https://images.pexels.com/photos/1421903/pexels-photo-1421903.jpeg?w=500","https://images.pexels.com/photos/355465/pexels-photo-355465.jpeg?w=500","https://images.pexels.com/photos/1165991/pexels-photo-1165991.jpeg?w=500","https://images.pexels.com/photos/1279813/pexels-photo-1279813.jpeg?w=500","https://images.pexels.com/photos/1536314/pexels-photo-1536314.jpeg?w=500","https://images.pexels.com/photos/1482476/pexels-photo-1482476.jpeg?w=500","https://images.pexels.com/photos/1421903/pexels-photo-1421903.jpeg?w=500"]
},
{
  title:"كليب غدر وخيانة - 20 صورة",
  music:"https://cdn.pixabay.com/download/audio/2021/08/04/audio_0625c1539c.mp3?filename=sad-background-music-9429.mp3",
  quotes:["الغدر من أقرب الناس هو الوجع الحقيقي","خنتني وكنت أظنك أماني","الخيانة جرح لا يلتئم","الغدر طبع والوفاء نادر","اللي يغدر مرة يغدر ألف مرة"],
  images:["https://images.pexels.com/photos/355465/pexels-photo-355465.jpeg?w=500","https://images.pexels.com/photos/1165991/pexels-photo-1165991.jpeg?w=500","https://images.pexels.com/photos/1279813/pexels-photo-1279813.jpeg?w=500","https://images.pexels.com/photos/1536314/pexels-photo-1536314.jpeg?w=500","https://images.pexels.com/photos/1482476/pexels-photo-1482476.jpeg?w=500","https://images.pexels.com/photos/1421903/pexels-photo-1421903.jpeg?w=500","https://images.pexels.com/photos/355465/pexels-photo-355465.jpeg?w=500","https://images.pexels.com/photos/1165991/pexels-photo-1165991.jpeg?w=500","https://images.pexels.com/photos/1279813/pexels-photo-1279813.jpeg?w=500","https://images.pexels.com/photos/1536314/pexels-photo-1536314.jpeg?w=500","https://images.pexels.com/photos/1482476/pexels-photo-1482476.jpeg?w=500","https://images.pexels.com/photos/1421903/pexels-photo-1421903.jpeg?w=500","https://images.pexels.com/photos/355465/pexels-photo-355465.jpeg?w=500","https://images.pexels.com/photos/1165991/pexels-photo-1165991.jpeg?w=500","https://images.pexels.com/photos/1279813/pexels-photo-1279813.jpeg?w=500","https://images.pexels.com/photos/1536314/pexels-photo-1536314.jpeg?w=500","https://images.pexels.com/photos/1482476/pexels-photo-1482476.jpeg?w=500","https://images.pexels.com/photos/1421903/pexels-photo-1421903.jpeg?w=500","https://images.pexels.com/photos/355465/pexels-photo-355465.jpeg?w=500","https://images.pexels.com/photos/1165991/pexels-photo-1165991.jpeg?w=500"]
}
];

const container=document.getElementById('clips');
const audio=document.getElementById('mainAudio');
let currentClip=null;

clipsData.forEach((clip,clipIndex)=>{
  let div=document.createElement('div');
  div.className='clip';
  div.innerHTML=`
    <div class="clip-bg" id="bg-${clipIndex}"></div>
    <div class="info">${clip.title}</div>
    <div class="timer" id="timer-${clipIndex}">00:00 / 00:40</div>
    <div class="clip-text" id="text-${clipIndex}">${clip.quotes[0]}</div>
    <div class="progress" id="prog-${clipIndex}"></div>
  `;
  div.onclick=()=>playClip(clipIndex);
  container.appendChild(div);
  
  // شغل الصور كل 2 ثانية = 20 صورة × 2 ثانية = 40 ثانية
  let imgIdx=0;
  let time=0;
  setInterval(()=>{
    if(currentClip===clipIndex){
      time+=0.1;
      document.getElementById(`prog-${clipIndex}`).style.width=(time/40*100)+"%";
      let sec=Math.floor(time);
      document.getElementById(`timer-${clipIndex}`).innerText=`00:${sec.toString().padStart(2,'0')} / 00:40`;
      if(time>=40){time=0; imgIdx=0;}
    }
    if(Math.floor(time*10)%20===0){ // كل 2 ثانية غير الصورة
      let bgEl=document.getElementById(`bg-${clipIndex}`);
      let textEl=document.getElementById(`text-${clipIndex}`);
      if(bgEl){
        bgEl.style.backgroundImage=`url('${clip.images[imgIdx%clip.images.length]}')`;
        textEl.innerText=clip.quotes[imgIdx%clip.quotes.length];
        imgIdx++;
      }
    }
  },100);
  
  // أول صورة
  document.getElementById(`bg-${clipIndex}`).style.backgroundImage=`url('${clip.images[0]}')`;
});

function playClip(index){
  currentClip=index;
  audio.src=clipsData[index].music;
  audio.play();
  document.getElementById('musicBtn').innerText="🔊 شغال: "+clipsData[index].title;
}

function toggleAll(){
  if(audio.paused){
    playClip(0);
  }else{
    audio.pause();
    document.getElementById('musicBtn').innerText="▶️ شغل الكل بالموسيقى";
  }
}
</script>
</body>
</html>
