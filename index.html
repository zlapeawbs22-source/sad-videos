
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>كلنا عابري سبيل</title>
<style>
body{background:#0f0f0f;color:#fff;font-family:Arial;text-align:center;padding:10px;margin:0}
h1{margin-top:30px;font-size:28px}
.video-box{margin:20px auto;max-width:600px;background:#1a1a1a;border-radius:12px;overflow:hidden}
iframe{width:100%;height:340px;border:none}
</style>
</head>
<body>
<h1>كلنا عابري سبيل 💔</h1>
<p>💔 الموقع شغال</p>
<div id="videos"></div>
<script>
fetch('videos.json?v='+Date.now()).then(r=>r.json()).then(list=>{
  const box=document.getElementById('videos');
  box.innerHTML='';
  list.forEach(v=>{
    let url=v.url.trim();
    let id='';
    if(url.includes('v=')) id=url.split('v=')[1].split('&')[0].split('?')[0];
    else if(url.includes('youtu.be/')) id=url.split('youtu.be/')[1].split('?')[0];
    else id=url;
    let div=document.createElement('div');
    div.className='video-box';
    div.innerHTML=`<iframe src="https://www.youtube.com/embed/${id}?rel=0" allow="autoplay; encrypted-media" allowfullscreen loading="lazy"></iframe>`;
    box.appendChild(div);
  });
});
</script>
</body>
</html>
