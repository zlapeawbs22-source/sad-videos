
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>كلنا عابري سبيل</title>
<style>
body{background:#000;color:#fff;margin:0;text-align:center;font-family:Arial}
h1{padding:15px;font-size:22px}
.box{width:92%;max-width:360px;height:600px;margin:15px auto;border-radius:16px;overflow:hidden;background:#111;position:relative}
.box video{width:100%;height:100%;object-fit:cover;background:#222}
.bg{position:absolute;inset:0;background-size:cover;background-position:center;filter:brightness(.5)}
.txt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;font-size:20px;font-weight:bold;text-shadow:2px 2px 10px #000}
#musicBtn{position:fixed;top:10px;left:10px;z-index:999;background:#e50914;color:#fff;border:none;padding:10px 14px;border-radius:20px;font-size:13px}
</style>
</head>
<body>
<button id="musicBtn">🔇 شغل الموسيقى</button>
<h1>كلنا عابري سبيل 💔</h1>
<div id="feed"></div>
<audio id="bgMusic" preload="none" loop></audio>

<script>
// فيديوهات خفيفة جدا - small بدل large
const vids=[
"https://assets.mixkit.co/videos/preview/mixkit-sad-girl-sitting-on-the-floor-412-small.mp4",
"https://assets.mixkit.co/videos/preview/mixkit-portrait-of-a-sad-and-upset-woman-402-small.mp4",
"https://assets.mixkit.co/videos/preview/mixkit-man-walking-in-the-rain-1257-small.mp4",
"https://assets.mixkit.co/videos/preview/mixkit-woman-sitting-alone-on-a-bench-at-night-1322-small.mp4"
];

const quotes=["الفراق لا يقتل القلب لكنه يترك القلب بلا حياة","الغدر من أقرب الناس هو الوجع الحقيقي","خنتني وكنت أظنك أماني","الخيانة جرح لا يلتئم","قلبي تعب من كتر الجراح"];
const bgs=["https://images.pexels.com/photos/1482476/pexels-photo-1482476.jpeg?w=400","https://images.pexels.com/photos/1421903/pexels-photo-1421903.jpeg?w=400"];

const feed=document.getElementById('feed');
for(let i=0;i<20;i++){
  let div=document.createElement('div'); div.className='box';
  if(i%2==0){
    // فيديو خفيف - مش هيحمل غير لما يظهر على الشاشة
    let v=vids[i%vids.length];
    div.innerHTML=`<video data-src="${v}" poster="" muted loop playsinline preload="none" controls></video>`;
  }else{
    div.innerHTML=`<div class=bg style="background-image:url('${bgs[i%bgs.length]}')"></div><div class=txt>${quotes[i%quotes.length]}</div>`;
  }
  feed.appendChild(div);
}

// تحميل الفيديو فقط لما يوصل له المستخدم - ده اللي بيخليه خفيف
const observer=new IntersectionObserver((entries)=>{
  entries.forEach(e=>{
    if(e.isIntersecting){
      let video=e.target.querySelector('video');
      if(video && !video.src){
        video.src=video.dataset.src;
        video.load();
      }
    }
  });
},{rootMargin:"200px"});

document.querySelectorAll('.box').forEach(b=>observer.observe(b));

// موسيقى خفيفة - بتحمل فقط لما يدوس شغل
const music=document.getElementById('bgMusic');
const musicList=[
"https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3?filename=sad-piano-110618.mp3"
];
music.src=musicList[0];
let playing=false;
document.getElementById('musicBtn').onclick=function(){
  if(playing){music.pause(); this.innerText='🔇 شغل الموسيقى';}
  else{music.play(); this.innerText='🔊 وقف الموسيقى';}
  playing=!playing;
};
</script>
</body>
</html>
