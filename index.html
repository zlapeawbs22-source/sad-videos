
<!DOCTYPE html>

<title>30 فيديو حزين مختلف</title>
<style>
body{background:#000;color:#fff;margin:0;text-align:center;font-family:Arial}
h1{margin-top:65px;font-size:18px}
.box{width:92%;max-width:380px;height:600px;margin:20px auto;border-radius:18px;overflow:hidden;position:relative;background:#111}
.box video{width:100%;height:100%;object-fit:cover}
.title{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,rgba(0,0,0,0.95));padding:40px 10px 12px;font-size:13px;font-weight:bold;line-height:1.6}
.num{position:absolute;top:10px;right:10px;background:#e50914;padding:4px 9px;border-radius:8px;font-size:11px}
.music{position:absolute;top:10px;left:10px;background:rgba(0,0,0,0.7);padding:4px 8px;border-radius:8px;font-size:10px}
#btn{position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:9999;background:#e50914;color:#fff;border:none;padding:12px 24px;border-radius:25px;font-weight:bold}
</style>

const feed=document.getElementById('feed');
videos.forEach((item,i)=>{
  let div=document.createElement('div');
  div.className='box';
  div.innerHTML=`<video data-src="${item.v}" data-music="${item.m}" loop muted playsinline preload="none" controls poster="https://picsum.photos/seed/sad${i}/400/600"></video><div class="num">فيديو ${i+1}/30</div><div class="music">🎵 أغنية ${i+1}</div><div class="title">${item.t}</div>`;
  div.onclick=function(){
    let vid=this.querySelector('video');
    if(!vid.src){ vid.src=vid.dataset.src; vid.load(); }
    vid.play();
    let bg=document.getElementById('bg');
    bg.src=vid.dataset.music; bg.volume=0.8; bg.play();
    document.getElementById('btn').innerText=`🔊 شغال: فيديو ${i+1} - ${item.t.substring(0,20)}`;
  };
  feed.appendChild(div);
});

function playFirst(){
  let v=document.querySelector('video');
  if(v){ if(!v.src){ v.src=v.dataset.src; v.load(); } v.play(); document.getElementById('bg').src=v.dataset.music; document.getElementById('bg').play(); }
}
</script>
