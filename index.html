
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>كلنا عابري سبيل</title>
<style>
body{background:#000;color:#fff;margin:0;font-family:Arial;text-align:center}
h1{padding:20px;font-size:26px}
#musicBtn{position:fixed;top:15px;left:15px;z-index:999;background:#e50914;color:#fff;border:none;padding:12px 18px;border-radius:25px}
.box{width:92%;max-width:400px;height:700px;margin:25px auto;border-radius:20px;overflow:hidden;position:relative;background:#111}
.box video{width:100%;height:100%;object-fit:cover}
.bg{position:absolute;inset:0;background-size:cover;background-position:center;filter:brightness(0.4);animation:zoom 10s infinite alternate}
.txt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;font-size:22px;font-weight:bold;text-shadow:2px 2px 10px #000;z-index:2}
@keyframes zoom{0%{transform:scale(1)}100%{transform:scale(1.2)}}
.tag{position:absolute;bottom:10px;right:10px;background:rgba(0,0,0,0.6);padding:5px 10px;border-radius:10px;font-size:11px;z-index:3}
</style>
</head>
<body>
<button id="musicBtn" onclick="toggleMusic()">🔊 الموسيقى</button>
<h1>كلنا عابري سبيل 💔</h1>
<div id="feed"></div>
<audio id="bgMusic" loop src="https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3?filename=sad-piano-110618.mp3"></audio>
<script>
const videos=["https://assets.mixkit.co/videos/preview/mixkit-sad-girl-sitting-on-the-floor-412-large.mp4","https://assets.mixkit.co/videos/preview/mixkit-portrait-of-a-sad-and-upset-woman-402-large.mp4","https://assets.mixkit.co/videos/preview/mixkit-sad-and-desperate-man-lying-on-a-sofa-436-large.mp4","https://assets.mixkit.co/videos/preview/mixkit-man-sitting-in-an-abandoned-building-424-large.mp4","https://assets.mixkit.co/videos/preview/mixkit-face-of-a-sad-man-crying-4123-large.mp4","https://assets.mixkit.co/videos/preview/mixkit-woman-sitting-alone-on-a-bench-at-night-1322-large.mp4"];
const quotes=["الفراق لا يقتل القلب لكنه يترك القلب بلا حياة","الغدر من أقرب الناس هو الوجع الحقيقي","الخيانة لا تأتي إلا ممن أحببناهم","وجع القلب أن تبتسم وفي داخلك تموت","خنتني وكنت أظنك أماني","أصعب فراق فراق من تحب","الخيانة جرح لا يلتئم","كنا نعتقد أن الفراق صعب حتى جربنا الغدر","الغدر طبع والوفاء عملة نادرة","فراق الحبيب يوجع أكثر من الموت","بعد الغدر لا عتاب ولا رجوع","قلبي تعب من كتر الجراح","سامحتك حتى نسيت كيف أسامح نفسي","الغدر يقتل الحب","خليتني أخاف أثق في حد تاني","اللي يغدر مرة يغدر ألف مرة"];
const bgs=["https://images.pexels.com/photos/1482476/pexels-photo-1482476.jpeg","https://images.pexels.com/photos/1421903/pexels-photo-1421903.jpeg","https://images.pexels.com/photos/355465/pexels-photo-355465.jpeg"];
const feed=document.getElementById('feed');
for(let i=0;i<300;i++){
 let isVideo=i%2==0;
 let div=document.createElement('div'); div.className='box';
 if(isVideo){
   let v=videos[Math.floor(Math.random()*videos.length)];
   div.innerHTML=`<video src="${v}" loop playsinline controls muted></video><div class="tag">🎬 فيديو فراق</div>`;
 }else{
   let q=quotes[Math.floor(Math.random()*quotes.length)];
   let bg=bgs[Math.floor(Math.random()*bgs.length)];
   div.innerHTML=`<div class="bg" style="background-image:url('${bg}?r=${i}')"></div><div class="txt">${q}</div><div class="tag">💔 غدر وخيانة</div>`;
 }
 feed.appendChild(div);
}
const music=document.getElementById('bgMusic'); let playing=false;
function toggleMusic(){ if(playing){music.pause(); document.getElementById('musicBtn').innerText='🔇 الموسيقى';} else {music.play(); document.getElementById('musicBtn').innerText='🔊 وقف الموسيقى';} playing=!playing; }
</script>
</body>
</html>
