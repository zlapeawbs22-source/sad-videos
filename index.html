DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>عابري سبيل</title></head><body style="background:#0a0e14;color:#fff;font-family:system-ui;text-align:center;padding:40px"> <h1>كلنا عابري سبيل</h1><p>الموقع شغال 💔</p><div id="list"></div><script>fetch("https://raw.githubusercontent.com/zlapeawbs22-source/sad-videos/main/videos.json").then(r=>r.json()).then(d=>{document.getElementById('list').innerHTML=d.map(v=>`<video src="${v.url}" controls style="width:90%;margin:20px auto;display:block"></video>`).join("")})</script></body></html>
